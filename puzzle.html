<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png?v=1" type="image/png">
    <title>Пятнашки — WebTrio</title>
    <style>
        :root {
            --color-primary: #2563EB;
            --color-primary-hover: #1D4ED8;
            --color-bg: #F8FAFC;
            --color-white: #FFFFFF;
            --color-text: #0F172A;
            --color-text-light: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: var(--color-bg); 
            color: var(--color-text);
            text-align: center;
            padding: 20px;
            line-height: 1.5;
        }
        header { 
            background: var(--color-white); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 40px;
            padding: 20px 10px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .logo { 
            font-size: 1.5rem; 
            font-weight: 700; 
            color: var(--color-primary);
            text-decoration: none;
        }
        nav { 
            display: flex; 
            justify-content: center; 
            gap: 16px; 
            flex-wrap: wrap;
        }
        nav a { 
            text-decoration: none; 
            color: var(--color-text);
            font-weight: 500;
            font-size: 0.95rem;
        }
        nav a:hover { 
            color: var(--color-primary); 
        }
        @media (max-width: 600px) {
            header { padding: 15px 10px; }
            .logo { font-size: 1.3rem; }
            nav { gap: 12px; }
            nav a { font-size: 0.9rem; }
            .nav-secondary { margin-top: 5px; }
        }
        h1 { margin-bottom: 20px; font-size: 1.8rem; }
        #puzzle {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 5px;
            margin: 20px auto;
            width: max-content;
        }
        .tile {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
            user-select: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tile:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .empty {
            background-color: #E2E8F0;
            cursor: default;
            box-shadow: none;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 5px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        #moves { 
            margin-top: 20px; 
            font-size: 1.1rem;
            color: var(--color-text-light);
        }
        #game-stats {
            margin-top: 20px;
            font-size: 14px;
            color: var(--color-text-light);
            padding: 10px;
            background: white;
            border-radius: 8px;
            display: inline-block;
        }
        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        @media (max-width: 400px) {
            #puzzle { grid-template-columns: repeat(4, 65px); }
            .tile { width: 65px; height: 65px; font-size: 20px; }
        }
    
        #leaderboard {
            margin-top: 30px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        #leaderboard h3 { margin-bottom: 12px; color: var(--color-text); }
        #leaderboard table { width: 100%; border-collapse: collapse; }
        #leaderboard th, #leaderboard td { padding: 8px; text-align: left; }
        #leaderboard tr { border-bottom: 1px solid #F1F5F9; }
        #leaderboard tr:last-child { border-bottom: none; }
        #leaderboard .date { color: var(--color-text-light); font-size: 0.9em; }
</style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">WebTrio</a>
        <nav class="nav-main">
            <a href="index.html#team">Команда</a>
            <a href="index.html#services">Услуги</a>
            <a href="index.html#portfolio">Работы</a>
        </nav>
        <nav class="nav-secondary">
            <a href="index.html#contacts">Контакты</a>
            <a href="games.html">Игры</a>
        </nav>
    </header>

    <h1>🎮 Игра "Пятнашки"</h1>
    <div id="puzzle"></div>
    <button id="shuffle">Перемешать</button>
    <p id="moves">Ходов: 0</p>
    <div id="game-stats"></div>
    <a href="games.html" class="back-link">← Вернуться на главную</a>

    <script>
        // === ИГРОВЫЕ ПЕРЕМЕННЫЕ ===
        let isGameReady = false;
        let gameFinished = false;
        const puzzle = document.getElementById('puzzle');
        const shuffleBtn = document.getElementById('shuffle');
        const movesDisplay = document.getElementById('moves');
        let tiles = [];
        let moves = 0;
        let isSolving = false;

        // === ИМЯ ИГРОКА ===
        let playerName = localStorage.getItem('puzzle_name');
        if (!playerName) {
            playerName = prompt('Введи имя для таблицы рекордов:') || 'Игрок';
            localStorage.setItem('puzzle_name', playerName);
        }

        // === СТАТИСТИКА ===
        let stats = JSON.parse(localStorage.getItem('puzzle_stats')) || { played: 0, won: 0, abandoned: 0 };

        function updateStatsDisplay() {
            let statsDiv = document.getElementById('game-stats');
            if (!statsDiv) {
                statsDiv = document.createElement('div');
                statsDiv.id = 'game-stats';
                statsDiv.style.marginTop = '20px';
                statsDiv.style.fontSize = '14px';
                statsDiv.style.color = '#64748B';
                document.body.appendChild(statsDiv);
            }
            statsDiv.innerHTML = `
                👤 Игрок: <b>${playerName}</b> | 
                🎮 Начато: ${stats.played} | 
                🏆 Собрано: ${stats.won} | 
                🔻 Брошено: ${stats.abandoned}
            `;
        }

        // === ИНИЦИАЛИЗАЦИЯ ИГРЫ ===
        function initGame() {
            puzzle.innerHTML = '';
            tiles = [];
            moves = 0;
            movesDisplay.textContent = `Ходов: ${moves}`;

            for (let i = 0; i < 15; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = i + 1;
                tile.onclick = () => moveTile(i);
                puzzle.appendChild(tile);
                tiles.push(tile);
            }

            const empty = document.createElement('div');
            empty.className = 'tile empty';
            empty.onclick = () => moveTile(15);
            puzzle.appendChild(empty);
            tiles.push(empty);
        }

        // === ПЕРЕМЕШИВАНИЕ ===
        function shuffle() {
            if (isSolving) return;

            // Если игра уже шла, считаем её брошенной
            if (isGameReady && !gameFinished) {
                stats.abandoned++;
            }

            // Фиксируем новую игру
            stats.played++;
            localStorage.setItem('puzzle_stats', JSON.stringify(stats));
            updateStatsDisplay();

            let attempts = 0;
            let isSolvable = false;

            while (!isSolvable && attempts < 100) {
                for (let i = 0; i < 1000; i++) {
                    const randomTile = Math.floor(Math.random() * 15);
                    const emptyPos = tiles.findIndex(t => t.classList.contains('empty'));
                    if (isAdjacent(randomTile, emptyPos)) swapTiles(randomTile, emptyPos);
                }
                isSolvable = checkSolvability();
                attempts++;
            }

            if (!isSolvable) {
                alert("Не удалось сгенерировать решаемую позицию. Попробуйте ещё раз.");
                initGame();
            } else {
                moves = 0;
                movesDisplay.textContent = `Ходов: ${moves}`;
            }
            isGameReady = true;
            gameFinished = false;
        }

        // === ПРОВЕРКА РЕШАЕМОСТИ ===
        function checkSolvability() {
            let inversions = 0;
            const flatTiles = tiles.flatMap(t => t.classList.contains('empty') ? 16 : parseInt(t.textContent || 16));
            const filtered = flatTiles.filter(n => n !== 16);

            for (let i = 0; i < filtered.length; i++) {
                for (let j = i + 1; j < filtered.length; j++) {
                    if (filtered[i] > filtered[j]) inversions++;
                }
            }

            const emptyRow = Math.floor(tiles.findIndex(t => t.classList.contains('empty')) / 4) + 1;
            return (inversions + emptyRow) % 2 === 0;
        }

        // === ХОД ИГРЫ ===
        function moveTile(index) {
            if (!isGameReady || isSolving || gameFinished) return;
            
            const emptyPos = tiles.findIndex(t => t.classList.contains('empty'));
            
            if (isAdjacent(index, emptyPos)) {
                swapTiles(index, emptyPos);
                moves++;
                movesDisplay.textContent = `Ходов: ${moves}`;
                
                if (checkWin()) {
                    gameFinished = true;
                    isGameReady = false;
                    stats.won++;
                    localStorage.setItem('puzzle_stats', JSON.stringify(stats));
                    updateStatsDisplay();
                                   
                    saveToLeaderboard(playerName, moves);
                    renderLeaderboard();
                  
                    setTimeout(() => alert(`Поздравляем! Вы решили головоломку за ${moves} ходов!`), 100);
                }
            }
        }

        // === ПРОВЕРКА СОСЕДСТВА ===
        function isAdjacent(a, b) {
            const aRow = Math.floor(a / 4), aCol = a % 4;
            const bRow = Math.floor(b / 4), bCol = b % 4;
            return Math.abs(aRow - bRow) + Math.abs(aCol - bCol) === 1;
        }

        // === ОБМЕН ПЛИТОК ===
        function swapTiles(a, b) {
            const temp = tiles[a].textContent;
            tiles[a].textContent = tiles[b].textContent;
            tiles[b].textContent = temp;
            tiles[a].classList.toggle('empty');
            tiles[b].classList.toggle('empty');
        }

        // === ПРОВЕРКА ПОБЕДЫ ===
        function checkWin() {
            for (let i = 0; i < 15; i++) {
                if (parseInt(tiles[i].textContent) !== i + 1) return false;
            }
            return true;
        }

        // === ЗАПУСК ===
        shuffleBtn.onclick = shuffle;
        initGame();
        updateStatsDisplay()
       
        renderLeaderboard(); // ← ДОБАВИТЬ
        // === ЛОВИМ КНОПКУ "НАЗАД" ===
    const backLink = document.querySelector('.back-link');
    if (backLink) {
        backLink.addEventListener('click', () => {
            // Если игра шла и не закончена — считаем брошенной
            if (isGameReady && !gameFinished) {
                stats.abandoned++;
                localStorage.setItem('puzzle_stats', JSON.stringify(stats));
            }
        });
    }

    // === ЛОВИМ ЗАКРЫТИЕ ВКЛАДКИ (Страховка) ===
    window.addEventListener('beforeunload', () => {
        if (isGameReady && !gameFinished) {
            stats.abandoned++;
            localStorage.setItem('puzzle_stats', JSON.stringify(stats));
        }
    });
        // === ТАБЛИЦА РЕКОРДОВ ===
        function saveToLeaderboard(name, moves) {
            let board = JSON.parse(localStorage.getItem('puzzle_leaderboard')) || [];
            board.push({ name, moves, date: new Date().toLocaleDateString() });
            board.sort((a, b) => a.moves - b.moves); // Сортируем по ходам (меньше = лучше)
            board = board.slice(0, 5); // Оставляем только топ-5
            localStorage.setItem('puzzle_leaderboard', JSON.stringify(board));
        }

        function renderLeaderboard() {
            let board = JSON.parse(localStorage.getItem('puzzle_leaderboard')) || [];
            let container = document.getElementById('leaderboard');
            if (!container) {
                container = document.createElement('div');
                container.id = 'leaderboard';
                document.body.appendChild(container);
            }

            let html = '<h3>🏆 Топ-5 рекордов</h3>';
            if (board.length === 0) {
                html += '<p style="color:#64748B;">Пока нет рекордов. Сыграй первым!</p>';
            } else {
                html += '<table><tr><th>#</th><th>Игрок</th><th>Ходы</th><th>Дата</th></tr>';
                board.forEach((entry, i) => {
                    let mark = i === 0 ? '' : i === 1 ? '🥈' : i === 2 ? '' : (i + 1);
                    html += `<tr><td>${mark}</td><td>${entry.name}</td><td><b>${entry.moves}</b></td><td class="date">${entry.date}</td></tr>`;
                });
                html += '</table>';
            }
            container.innerHTML = html;
        }
</script>
</body>
</html>
